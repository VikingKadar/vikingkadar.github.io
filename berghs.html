  <style>
    /* Page-only styles. Shared components live in assets/site.css. */

    /* Hub header: copy only, no media column, and no 92svh stretch. The timeline right under it is the opening visual. */
    .case-head.hub{grid-template-columns:1fr;min-height:0;align-items:start;padding-bottom:clamp(24px,4vh,44px)}
    .case-head.hub .copy{max-width:960px}
    .case-head.hub .kicker2{max-width:40ch}

    /* The horizontal timeline sits directly under the header. */
    .sec.tl-sec{padding-top:0;padding-bottom:clamp(48px,7vh,88px)}
    .htl .foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:12px}
    .htl .foot a{display:inline-flex;align-items:center;gap:6px}
    .htl .foot a .ar{display:inline-block;transition:transform .3s var(--ease)}
    .htl .foot a:hover{text-decoration:underline}
    .htl .foot a:hover .ar{transform:translateX(3px)}
    .htl p.mute{margin:0 0 4px;max-width:none}
    /* Wide screens: the entries share the width instead of scrolling, as long as they fit (160px each). */
    @media(min-width:1280px){.htl>div{flex:1 1 160px;width:auto;min-width:160px}}

    /* Courses */
    #courses{border-top:1px solid var(--line)}
    /* Three cards in two columns: the last one takes the whole row instead of leaving a hole. */
    @media(min-width:700px) and (max-width:1099px){#grid .tile:last-child:nth-child(odd){grid-column:1/-1}}
    /* Four cards on a wide screen: two rows of two, never three plus one. */
    @media(min-width:1100px){#grid:has(> .tile:nth-child(4):last-child){grid-template-columns:repeat(2,1fr)}}
  </style>

  <main>
    <!-- 1. HEADER: title, sub line and the two chips read out of the sub line. -->
    <header class="case-head hub grain" id="top">
      <div class="copy">
        <a class="back rv" href="index.html" data-track="story_back" data-channel="berghs_top">← Back to the portfolio</a>

      </div>
    </header>

    <!-- 2. OPENING VISUAL: the horizontal timeline, one entry per course. -->
    <section class="sec tl-sec" id="path" aria-label="Course timeline">
      <div class="htl" id="timeline" data-overflow-ok></div>
    </section>

    <!-- 3. ONE PAGE PER FINISHED COURSE: picture tiles via VK.tiles. -->
    <section class="sec grain" id="courses">
      <div class="head rv">
        <h2 class="disp h2" id="grid-title">One page per course</h2>
      </div>
      <div class="cards c3" id="grid"></div>
    </section>

  <script src="assets/content.js"></script>
  <script src="assets/site.js"></script>
  <script>
    /* ============================================================
       RENDER. Everything on this page comes from assets/content.js
       (CONTENT.berghs). Nothing below needs editing when the content changes.
       ============================================================ */
    (function () {
      const C = VK.C, D = C.berghs || {}, el = VK.el;
      // TODO Viking: check the course names and dates in Canvas and correct them in content.js (berghs.timeline). This page follows that list.

      /* ---------- header ---------- */
      VK.text('#title', D.title);
      VK.text('#sub', D.sub);
      // The two chips are read out of the sub line itself ("Growth Marketing, Berghs School of Communication, 2026–2027."):
      // the programme is the first part, the period is the part that looks like a year span. Nothing is typed in here.
      const parts = String(D.sub || '').replace(/[.\s]+$/, '').split(/,\s*/).map(s => s.trim()).filter(Boolean);
      const period = parts.find(p => /^\d{4}(\s*[–-]\s*\d{2,4})?$/.test(p));
      const programme = parts.length > 1 && !/^\d/.test(parts[0]) ? parts[0] : '';
      const meta = document.getElementById('meta');
      if (period) meta.appendChild(el('span', { class: 'chip on' }, period));
      if (programme) meta.appendChild(el('span', { class: 'chip' }, programme));
      if (!meta.children.length) meta.classList.add('hidden');

      /* ---------- timeline ---------- */
      const L = D.statusLabel || {};
      const tl = document.getElementById('timeline');
      (D.timeline || []).forEach(e => {
        if (!e || !e.title) return;
        const d = el('div', { class: e.status || '' });
        if (e.when) d.appendChild(el('div', { class: 'when' }, e.when));
        d.appendChild(el('h3', {}, e.title));
        if (e.sub) d.appendChild(el('p', { class: 'mute', style: 'font-size:13px' }, e.sub));
        const foot = el('div', { class: 'foot' });
        if (L[e.status]) foot.appendChild(el('span', { class: 'chip' + (e.status === 'done' ? ' on' : '') }, L[e.status]));
        // A link only when the page exists and its flag is on. SEO keeps its real status but stays unlinked while SEO_READY is false.
        if (e.href && VK.isOn(e.flag)) foot.appendChild(el('a', { href: e.href, data: { track: 'course_open', channel: e.id || '' } }, ['Open ', VK.arrow()]));
        if (foot.children.length) d.appendChild(foot);
        tl.appendChild(d);
      });
      if (tl.children.length) VK.stagger('#timeline', 5); else document.getElementById('path').classList.add('hidden');

      /* ---------- one page per finished course ---------- */
      // The period rides along as the first chip; the tiles carry no big number.
      VK.text('#grid-title', D.gridTitle);
      const items = (D.timeline || []).filter(e => e && e.href).map(e => ({ id: e.id, href: e.href, title: e.title, line: e.line, tags: [e.when].concat(e.tags || []).filter(Boolean), img: e.img, bigText: e.bigText, flag: e.flag }));
      VK.tiles('#grid', items, { event: 'course_open', go: 'Open the course →' });
      const grid = document.getElementById('grid');
      if (grid.classList.contains('hidden')) document.getElementById('courses').classList.add('hidden'); else VK.stagger('#grid', 3);

      /* ---------- prev / next, contact, footer ---------- */
      VK.pagenav('#pagenav',
        { href: 'projects.html', label: 'My own projects', dir: 'Also', event: 'project_open', channel: 'projects_from_berghs' },
        { href: 'course-opera.html', label: 'The Royal Opera', dir: 'First course', event: 'course_open', channel: 'opera' });
      VK.contact('#contact', { channel: 'email_footer' });
      VK.text('#footer-left', VK.S.footer);
    })();
  </script>
